subject: cs
domain: data-structures
label: 자료구조
order: 1

modules:
  - id: linear
    label: 선형 구조
    topics:
      - id: cs.ds.array
        title: 배열
        goal: 임의 접근이 상수 시간인 이유를 메모리 배치로 설명한다
        difficulty: 1
        estimatedMinutes: 20
        prerequisites: [cs.prog.variables-types]
        keywords: [연속 메모리, 인덱스, 임의접근]

      - id: cs.ds.linked-list
        title: 연결 리스트
        goal: 배열과 비교해 삽입과 삭제가 유리한 이유를 설명한다
        difficulty: 2
        estimatedMinutes: 25
        prerequisites: [cs.ds.array]
        keywords: [노드, 포인터, 삽입, 삭제]

      - id: cs.ds.stack-queue
        title: 스택과 큐
        goal: 두 구조가 각각 어떤 문제에 맞는지 예로 설명한다
        difficulty: 2
        estimatedMinutes: 25
        prerequisites: [cs.ds.linked-list]
        keywords: [LIFO, FIFO, 호출스택, BFS]

      - id: cs.ds.hash-table
        title: 해시 테이블
        goal: 평균 상수 시간 조회가 성립하는 조건과 충돌 처리를 설명한다
        difficulty: 3
        estimatedMinutes: 30
        prerequisites: [cs.ds.array]
        keywords: [해시함수, 충돌, 체이닝, 적재율]
