subject: cs
domain: architecture
label: 언어와 컴퓨터 구조
order: 4

modules:
  - id: execution
    label: 실행과 메모리
    topics:
      - id: cs.arch.memory-layout
        title: 메모리 구조 — 스택과 힙
        goal: 스택과 힙에 각각 무엇이 언제 놓이는지 설명한다
        difficulty: 2
        estimatedMinutes: 25
        prerequisites: [cs.prog.functions]
        keywords: [스택, 힙, 수명, 할당]

      - id: cs.arch.gpu
        title: GPU 가 딥러닝에 쓰이는 이유
        goal: 병렬 처리 구조가 행렬 연산에 맞는 이유를 설명한다
        difficulty: 3
        estimatedMinutes: 30
        required: recommended
        prerequisites: [cs.arch.memory-layout, math.la.matrix-ops]
        keywords: [SIMD, 처리량, 코어, 메모리 대역폭]
