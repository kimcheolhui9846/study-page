# 이 파일은 초안이다. 내용은 자유롭게 고쳐 쓴다.
#
# ★ 수학만의 규칙 (스펙 §5.8)
#
# goal 을 계산이 아니라 개념·서술로 잡는다.
# gpt-4o-mini 는 계산이 틀린 문제를 자신 있게 내고, 루브릭까지 틀리면
# 정답을 쓴 사람을 오답 처리한다. 프롬프트로 없앨 수 없는 모델 한계다.
#
# 나쁜 goal: "다음 적분을 계산한다"
# 좋은 goal: "치환적분이 왜 성립하는지 연쇄법칙으로 설명한다"
#
# 서술형은 모델이 훨씬 잘하고, 루브릭 대조 채점도 안정적이다.

subject: math
label: 수학
days:
  - day: 1
    topic: 극한의 엄밀한 정의
    goal: 엡실론-델타 정의가 "가까워진다"는 직관을 어떻게 형식화하는지 설명한다
    keywords: [엡실론-델타, 수렴, 근방, 임의의]
    difficulty: 4

  - day: 2
    topic: 미분계수와 접선
    goal: 미분 가능성이 연속성보다 강한 조건인 이유를 반례로 보인다
    keywords: [평균변화율, 순간변화율, 절댓값 함수, 좌미분계수]
    difficulty: 3

  - day: 3
    topic: 연쇄법칙
    goal: 연쇄법칙이 왜 곱의 형태가 되는지 변화율의 합성으로 설명한다
    keywords: [합성함수, 변화율, 치환, 미분 연산자]
    difficulty: 3

  - day: 4
    topic: 정적분과 넓이
    goal: 리만 합의 극한이 왜 넓이와 같아지는지 설명한다
    keywords: [리만 합, 분할, 상합과 하합, 적분 가능]
    difficulty: 4

  - day: 5
    topic: 미적분학의 기본정리
    goal: 미분과 적분이 역연산이라는 주장이 정확히 무엇을 의미하는지 서술한다
    keywords: [원시함수, 누적함수, 제1기본정리, 제2기본정리]
    difficulty: 4

  - day: 6
    topic: 벡터의 내적
    goal: 내적이 왜 두 벡터의 "정렬 정도"를 재는지 기하적으로 설명한다
    keywords: [코사인, 정사영, 직교, 성분 표현]
    difficulty: 2

  - day: 7
    topic: 행렬식의 의미
    goal: 행렬식의 부호와 크기가 각각 무엇을 뜻하는지 넓이 변화로 설명한다
    keywords: [선형변환, 넓이 배율, 방향 반전, 특이행렬]
    difficulty: 3
