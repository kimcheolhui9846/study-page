# 기초 수학 보충
#
# ★ 이 영역은 본선이 아니다. required: optional 이고, 계획 엔진이 여기 Topic 을
# 고르는 경로는 단 하나 — 다른 Topic 의 remediation 에서 끌려 나오는 것뿐이다.
# "필요한 경우에만 보충"을 의지가 아니라 구조로 만든다.

subject: math
domain: foundation
label: 기초 수학 보충
order: 0

modules:
  - id: algebra
    label: 식과 함수
    topics:
      - id: math.foundation.expressions
        title: 식의 계산
        goal: 분배법칙과 인수분해가 같은 식을 다르게 쓰는 일임을 설명한다
        difficulty: 1
        estimatedMinutes: 20
        required: optional
        remediation: [math.foundation.expression-drill]
        keywords: [분배법칙, 인수분해, 동류항]

      - id: math.foundation.functions
        title: 함수
        goal: 함수를 입력과 출력의 대응으로 설명하고 그래프와 연결한다
        difficulty: 1
        estimatedMinutes: 25
        required: optional
        prerequisites: [math.foundation.expressions]
        remediation: [math.foundation.function-drill]
        keywords: [정의역, 치역, 대응, 그래프]

      - id: math.foundation.coordinates
        title: 좌표와 그래프
        goal: 좌표평면 위의 점과 순서쌍이 같은 것임을 설명한다
        difficulty: 1
        estimatedMinutes: 20
        required: optional
        remediation: [math.foundation.slope-drill]
        keywords: [좌표평면, 순서쌍, 기울기]

      - id: math.foundation.exp-log
        title: 지수와 로그
        goal: 로그가 지수의 역함수임을 설명하고 밑 변환의 의미를 말한다
        difficulty: 2
        estimatedMinutes: 30
        required: optional
        prerequisites: [math.foundation.functions]
        keywords: [지수법칙, 로그, 밑, 역함수]

  # ★ 계산 연습.
  #
  # 수학 Topic 의 목표가 전부 "설명한다"로 끝나 있었다. 그런데 실제로 막히는
  # 자리는 「함수의 값 계산 방법」·「기울기 계산 방법」처럼 전부 계산이었다.
  # 개념을 설명할 줄 아는 것과 손으로 풀 줄 아는 것은 다르다.
  #
  # ★ 선수를 갖지 않는다. 못 넘겨서 여기로 내려오는 것인데 선수를 걸면
  # 바로 그 상황에서 잠긴다 — 보충 경로가 막다른 길이 된다.
  - id: drill
    label: 계산 연습
    topics:
      - id: math.foundation.expression-drill
        title: 식 계산 연습
        goal: 주어진 식을 전개하고 인수분해해서 결과를 쓴다
        kind: practice
        difficulty: 1
        estimatedMinutes: 15
        required: optional
        keywords: [전개, 인수분해, 동류항, 공통인수]
        questionTypes: [calculation, procedure]

      - id: math.foundation.function-drill
        title: 함수값 계산 연습
        goal: 함수식에 값을 넣어 결과를 구하고 정의역과 치역을 찾는다
        kind: practice
        difficulty: 1
        estimatedMinutes: 15
        required: optional
        keywords: [함수값, 대입, 정의역, 치역]
        questionTypes: [calculation]

      - id: math.foundation.slope-drill
        title: 기울기 계산 연습
        goal: 두 점이 주어졌을 때 기울기를 계산하고 직선의 식을 쓴다
        kind: practice
        difficulty: 1
        estimatedMinutes: 15
        required: optional
        keywords: [기울기, 두 점, 직선의 식, y절편]
        questionTypes: [calculation, procedure]
